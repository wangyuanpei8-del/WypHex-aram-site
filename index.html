<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="description" content="英雄联盟海克斯大乱斗：全英雄出装与海克斯评级、出场率、海克斯选取率，每日自动更新，一屏查完。" />
  <title>海斗助手 · 海克斯大乱斗出装与海克斯</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23c9a961'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" data-action="home" aria-label="海斗助手首页">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 9l6 3.5v7L16 23l-6-3.5v-7z" fill="currentColor"/></svg>
        <span>海斗助手</span>
      </a>

      <label class="search" for="search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" autocomplete="off" spellcheck="false"
               placeholder="搜英雄：亚索 / 风男 / yasuo" aria-label="搜索英雄" />
        <kbd class="kbd" aria-hidden="true">/</kbd>
      </label>

      <div class="meta" id="meta" aria-live="polite"></div>
    </div>
  </header>

  <main class="layout">
    <!-- 左：榜单 -->
    <section class="board" aria-label="榜单">
      <div class="seg" role="tablist" id="boardTabs">
        <button role="tab" data-board="heroes" aria-selected="true">英雄</button>
        <button role="tab" data-board="augments" aria-selected="false">海克斯</button>
        <button role="tab" data-board="items" aria-selected="false">装备</button>
        <button role="tab" data-board="bands" aria-selected="false">乐队</button>
      </div>

      <div class="filters" id="filters"></div>
      <div class="list-head" id="listHead"></div>
      <div class="list" id="list" role="listbox" aria-label="榜单列表"></div>
    </section>

    <!-- 右：英雄详情 -->
    <section class="detail" id="detail" aria-label="英雄详情" aria-live="polite"></section>
  </main>

  <footer class="foot" id="foot"></footer>

  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 数据：由 scripts/import-sheet.mjs 自动生成；以 script 方式加载，双击本地文件也能用 -->
  <script src="data/data.js"></script>
  <script src="data/icons.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
