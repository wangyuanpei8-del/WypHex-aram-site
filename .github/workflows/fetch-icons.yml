name: 下载图标

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 下载英雄头像、装备和海克斯图标
        run: node scripts/fetch-icons.mjs
      - name: 生成单文件版
        run: node scripts/build-standalone.mjs
      - name: 提交图标
        run: |
          git config user.name "hexaram-bot"
          git config user.email "hexaram-bot@users.noreply.github.com"
          git add data/icons.js dist assets/icons
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "更新图标 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
