name: Hexdata 英雄页

# Hexdata 有访问频率限制，每个英雄页不能一次读完。这个任务每 3 小时运行一次，
# 每次最多读 30 个需要更新的英雄页；Hexdata 数据没变时只读 3 个排行页，不会产生提交。
on:
  schedule:
    - cron: '40 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 下载 Hexdata 胜率和英雄页
        run: node scripts/fetch-hexdata.mjs
      - name: 合并进网页数据
        run: node scripts/import-sheet.mjs
      - name: 补齐新海克斯与装备图标
        run: node scripts/fetch-icons.mjs
      - name: 生成单文件版
        run: node scripts/build-standalone.mjs
      - name: 提交到当前分支
        run: |
          git config user.name "hexaram-bot"
          git config user.email "hexaram-bot@users.noreply.github.com"
          git add data dist assets/icons
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "Hexdata 更新 $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
