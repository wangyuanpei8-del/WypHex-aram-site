name: 检查 Hexdata 完整搭配数据入口
on:
  push:
    paths:
      - 'scripts/inspect-hexdata-source.mjs'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/inspect-hexdata-source.mjs
