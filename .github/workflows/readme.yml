name: 更新 README 时间
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  readme:
    if: github.actor != 'github-actions[bot]'
    concurrency:
      group: update-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 更新项目提交时间
        run: README_UPDATE_AT="$(git log -1 --format=%cI)" node scripts/update-readme.mjs project
      - name: 保存 README
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "hexaram-bot"
          git config user.email "hexaram-bot@users.noreply.github.com"
          git add README.md
          git commit -m "更新 README 项目时间"
          git push origin HEAD:main
