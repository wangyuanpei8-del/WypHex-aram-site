name: 检查待同步英雄的普通页面
on:
  push:
    paths: ['scripts/check-public-hero.cjs']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix work/browser --no-save playwright
      - run: node scripts/check-public-hero.cjs
