name: 每日自动更新

# 每天从 arammayhem.com（出场率、选取率、组合）、Hexdata（胜率）和 Blitz（每个英雄的海克斯、装备评级）拉取数据，
# 合并进网页。Hexdata、Blitz 拉取失败时跳过，网页沿用上一次的数据。支持在测试分支或 main 分支运行。
on:
  schedule:
    - cron: '0 19 * * *'   # 每天北京时间 03:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 下载 arammayhem 开放数据
        run: node scripts/fetch-open-data.mjs
      - name: 下载 Hexdata 胜率
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/fetch-hexdata.mjs
      - name: 下载 Blitz 评级
        continue-on-error: true
        run: node scripts/fetch-blitz.mjs
      - name: 合并进网页数据
        run: node scripts/import-sheet.mjs
      - name: 补齐新海克斯与装备图标
        run: node scripts/fetch-icons.mjs
      - name: 生成单文件版
        run: node scripts/build-standalone.mjs
      - name: 提交到当前分支
        run: |
          git config user.name "hexaram-bot"
          git config user.email "hexaram-bot@users.noreply.github.com"
          git add data dist assets/icons
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "每日更新 $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
