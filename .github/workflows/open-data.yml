name: 每日自动更新

# 每天从 Blitz (data.v2.iesdev.com) + arammayhem.com 拉取真实海克斯大乱斗数据，
# 严格校验样本量后更新网页（不生成任何兜底假数据）。支持在任意测试分支或 main 分支运行。
on:
  schedule:
    - cron: '0 19 * * *'   # 每天北京时间 03:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 同步 Blitz 与开放数据
        run: node scripts/sync-all-data.mjs
      - name: 补齐新海克斯与装备图标
        run: node scripts/fetch-icons.mjs
      - name: 生成单文件版
        run: node scripts/build-standalone.mjs
      - name: 提交到当前分支
        run: |
          git config user.name "hexaram-bot"
          git config user.email "hexaram-bot@users.noreply.github.com"
          git add data dist assets/icons
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "每日更新 $(date -u +%Y-%m-%d)"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
