name: 更新海斗数据

on:
  schedule:
    - cron: '0 19 * * *'   # 每天北京时间 03:00
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 采样对局并重算数据
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          RIOT_PLATFORM: ${{ vars.RIOT_PLATFORM || 'kr' }}
          QUEUE_ID: ${{ vars.QUEUE_ID }}
          MAX_REQUESTS: ${{ vars.MAX_REQUESTS || '9000' }}
        run: node scripts/update-data.mjs
      - name: 下载英雄头像、装备和海克斯图标
        run: node scripts/fetch-icons.mjs
      - name: 生成单文件版
        run: node scripts/build-standalone.mjs
      - name: 提交数据
        run: |
          git config user.name "hexaram-bot"
          git config user.email "hexaram-bot@users.noreply.github.com"
          git add data dist assets/icons
          git diff --cached --quiet && echo "无变化" && exit 0
          git commit -m "数据更新 $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
