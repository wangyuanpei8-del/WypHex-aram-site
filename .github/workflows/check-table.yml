name: 检查英雄页面可见搭配表
on:
  push:
    paths:
      - 'scripts/check-hexdata-table.cjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix work/browser --no-save playwright
      - run: node scripts/check-hexdata-table.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible-hero-table
          path: |
            work/hexdata-page.png
            work/hexdata-rendered.html
          retention-days: 1
